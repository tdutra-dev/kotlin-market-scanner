version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kotlin-market-scanner-postgres
    environment:
      POSTGRES_DB: market_scanner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kotlin-market-scanner-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: kotlin-market-scanner-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  app:
    build: .
    container_name: kotlin-market-scanner-app
    depends_on:
      - postgres
      - kafka
    environment:
      DB_URL: r2dbc:postgresql://postgres:5432/market_scanner
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: price-ticks
      KAFKA_CONSUMER_GROUP: market-scanner-group
    ports:
      - "8080:8080"

volumes:
  postgres-data:
