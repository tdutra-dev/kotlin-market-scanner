version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kotlin-market-scanner-postgres
    environment:
      POSTGRES_DB: market_scanner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: kotlin-market-scanner-app
    depends_on:
      - postgres
    environment:
      DB_URL: r2dbc:postgresql://postgres:5432/market_scanner
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"

volumes:
  postgres-data:
